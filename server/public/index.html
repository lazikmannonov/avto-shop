<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pul.zarill</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
        header { background: #111; color: #fff; padding: 18px; text-align: center; }
        header h1 { margin: 0; font-size: clamp(22px, 6vw, 30px); }
        header p { margin: 6px 0 0; color: #bbb; font-size: clamp(13px, 3.5vw, 15px); }
        header a { color: #7CFC9A; text-decoration: none; font-weight: bold; }
        .lang-bar { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
        .lang-bar button { background: #222; color: #ccc; border: 1px solid #444; border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
        .lang-bar button.active { background: #7CFC9A; color: #111; border-color: #7CFC9A; font-weight: bold; }
        main { max-width: 900px; margin: 20px auto; padding: 0 12px; }
        .filters { background: #fff; border-radius: 10px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.12); margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .filters .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
        .filters label { font-size: 12px; color: #666; }
        .filters input[type="text"] { padding: 10px; font-size: 15px; border: 1px solid #ddd; border-radius: 6px; width: 100%; }
        .filters .fav-toggle { display: flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; }
        .filters .fav-toggle input { width: 18px; height: 18px; }
        .filters button.reset { padding: 10px 14px; font-size: 14px; border: none; border-radius: 6px; background: #eee; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
        .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.12); position: relative; }
        .card img.thumb { width: 100%; height: 170px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; background: #eee; cursor: pointer; }
        .fav-btn { position: absolute; top: 26px; right: 26px; background: rgba(255,255,255,.9); border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .fav-btn.active { color: #d33; }
        .card h3 { margin: 0 0 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 18px; }
        .badge-sold { background: #d33; color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 5px; font-weight: bold; }
        .desc { font-size: 14px; color: #555; margin-bottom: 12px; white-space: pre-wrap; }
        .price { font-size: 20px; font-weight: bold; color: #0a7d3b; margin-bottom: 14px; }
        .call { display: block; text-align: center; background: #0a7d3b; color: #fff; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .empty { text-align: center; color: #777; grid-column: 1 / -1; }

        #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 100; align-items: center; justify-content: center; flex-direction: column; }
        #lightbox.open { display: flex; }
        #lightbox img { max-width: 92vw; max-height: 76vh; object-fit: contain; border-radius: 6px; }
        #lightbox .nav { display: flex; align-items: center; gap: 24px; margin-top: 16px; }
        #lightbox button { background: #fff; border: none; border-radius: 6px; padding: 10px 16px; font-size: 18px; cursor: pointer; }
        #lightbox .close { position: absolute; top: 18px; right: 22px; background: transparent; color: #fff; font-size: 30px; border: none; cursor: pointer; }
        #lightbox .counter { color: #ccc; font-size: 14px; }

        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
            .filters { flex-direction: column; align-items: stretch; }
            .filters .fav-toggle { justify-content: flex-start; }
            .filters button.reset { width: 100%; }
        }
    </style>
</head>
<body>
<header>
    <h1>pul.zarill</h1>
    <p id="tagline">Arzon avtomobillar do'koni</p>
    <p><span id="contactLabel">Bog'lanish</span>: <a href="tel:+998889500005">+998 88 950 00 05</a></p>
    <div class="lang-bar">
        <button data-lang="uz" onclick="setLang('uz')">UZ</button>
        <button data-lang="ru" onclick="setLang('ru')">RU</button>
        <button data-lang="en" onclick="setLang('en')">EN</button>
    </div>
</header>
<main>
    <div class="filters">
        <div class="field">
            <label id="searchLabel">Qidirish</label>
            <input id="search" type="text" placeholder="Masalan: Nexia">
        </div>
        <label class="fav-toggle">
            <input id="favOnly" type="checkbox">
            <span id="favOnlyLabel">Faqat sevimlilar</span>
        </label>
        <button class="reset" onclick="resetFilters()" id="resetBtn">Tozalash</button>
    </div>
    <div id="list" class="grid"></div>
</main>

<div id="lightbox">
    <button class="close" onclick="closeLightbox()">&times;</button>
    <img id="lightbox-img" src="">
    <div class="nav">
        <button onclick="prevImage()">&larr;</button>
        <span class="counter" id="lightbox-counter"></span>
        <button onclick="nextImage()">&rarr;</button>
    </div>
</div>

<script>
    let currentImages = [];
    let currentIndex = 0;
    let allCars = [];

    // =========================
    // TRANSLATIONS
    // =========================
    const translations = {
        uz: {
            tagline: "Arzon avtomobillar do'koni",
            contactLabel: "Bog'lanish",
            searchLabel: "Qidirish",
            searchPlaceholder: "Masalan: Nexia",
            favOnlyLabel: "Faqat sevimlilar",
            resetBtn: "Tozalash",
            callBtn: "Qo'ng'iroq qilish",
            soldBadge: "SOTILDI",
            emptyNoCars: "Hozircha mashinalar yo'q",
            emptyNoMatch: "Mos mashina topilmadi"
        },
        ru: {
            tagline: "Магазин недорогих автомобилей",
            contactLabel: "Связаться",
            searchLabel: "Поиск",
            searchPlaceholder: "Например: Nexia",
            favOnlyLabel: "Только избранное",
            resetBtn: "Очистить",
            callBtn: "Позвонить",
            soldBadge: "ПРОДАНО",
            emptyNoCars: "Пока нет автомобилей",
            emptyNoMatch: "Ничего не найдено"
        },
        en: {
            tagline: "Affordable car store",
            contactLabel: "Contact",
            searchLabel: "Search",
            searchPlaceholder: "e.g. Nexia",
            favOnlyLabel: "Favorites only",
            resetBtn: "Clear",
            callBtn: "Call",
            soldBadge: "SOLD",
            emptyNoCars: "No cars yet",
            emptyNoMatch: "No matching cars"
        }
    };

    let currentLang = localStorage.getItem('lang') || 'uz';

    function setLang(lang) {
        currentLang = lang;
        localStorage.setItem('lang', lang);
        applyLang();
        render();
    }

    function applyLang() {
        const t = translations[currentLang];
        document.getElementById('tagline').textContent = t.tagline;
        document.getElementById('contactLabel').textContent = t.contactLabel;
        document.getElementById('searchLabel').textContent = t.searchLabel;
        document.getElementById('search').placeholder = t.searchPlaceholder;
        document.getElementById('favOnlyLabel').textContent = t.favOnlyLabel;
        document.getElementById('resetBtn').textContent = t.resetBtn;
        document.querySelectorAll('.lang-bar button').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === currentLang);
        });
    }

    // =========================
    // FAVORITES (localStorage)
    // =========================
    function getFavorites() {
        try {
            return JSON.parse(localStorage.getItem('favorites') || '[]');
        } catch (e) {
            return [];
        }
    }
    function isFavorite(id) {
        return getFavorites().includes(id);
    }
    function toggleFavorite(id) {
        let favs = getFavorites();
        if (favs.includes(id)) {
            favs = favs.filter(f => f !== id);
        } else {
            favs.push(id);
        }
        localStorage.setItem('favorites', JSON.stringify(favs));
        render();
    }

    // =========================
    // STATS
    // =========================
    function trackView() {
        fetch('/api/stats/view', { method: 'POST' }).catch(() => {});
    }
    function trackCall() {
        fetch('/api/stats/call', { method: 'POST' }).catch(() => {});
    }

    // =========================
    // LOAD & RENDER
    // =========================
    async function load() {
        const res = await fetch('/api/cars');
        allCars = await res.json();
        render();
    }

    function render() {
        const t = translations[currentLang];
        const query = document.getElementById('search').value.trim().toLowerCase();
        const favOnly = document.getElementById('favOnly').checked;

        const cars = allCars.filter(car => {
            const matchesName = !query || car.name.toLowerCase().includes(query);
            const matchesFav = !favOnly || isFavorite(car.id);
            return matchesName && matchesFav;
        });

        const list = document.getElementById('list');
        list.innerHTML = '';
        if (cars.length === 0) {
            const message = allCars.length === 0 ? t.emptyNoCars : t.emptyNoMatch;
            list.innerHTML = '<p class="empty">' + message + '</p>';
            return;
        }
        for (const car of cars) {
            const images = car.images || [];
            const card = document.createElement('div');
            card.className = 'card';

            if (images.length) {
                const img = document.createElement('img');
                img.className = 'thumb';
                img.src = '/uploads/' + images[0];
                img.alt = car.name;
                img.onclick = () => openLightbox(images, 0);
                card.appendChild(img);
            }

            const favBtn = document.createElement('button');
            favBtn.className = 'fav-btn' + (isFavorite(car.id) ? ' active' : '');
            favBtn.textContent = isFavorite(car.id) ? '♥' : '♡';
            favBtn.onclick = () => toggleFavorite(car.id);
            card.appendChild(favBtn);

            const title = document.createElement('h3');
            title.textContent = car.name;
            if (car.sold) {
                const badge = document.createElement('span');
                badge.className = 'badge-sold';
                badge.textContent = t.soldBadge;
                title.appendChild(badge);
            }
            card.appendChild(title);

            if (car.description) {
                const desc = document.createElement('div');
                desc.className = 'desc';
                desc.textContent = car.description;
                card.appendChild(desc);
            }

            const price = document.createElement('div');
            price.className = 'price';
            price.textContent = car.price.toLocaleString('ru-RU') + " so'm";

            const call = document.createElement('a');
            call.className = 'call';
            call.href = 'tel:+998889500005';
            call.textContent = t.callBtn;
            call.onclick = trackCall;

            card.append(price, call);
            list.appendChild(card);
        }
    }

    function openLightbox(images, index) {
        currentImages = images;
        currentIndex = index;
        showCurrent();
        document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('open');
    }
    function showCurrent() {
        document.getElementById('lightbox-img').src = '/uploads/' + currentImages[currentIndex];
        document.getElementById('lightbox-counter').textContent = (currentIndex + 1) + ' / ' + currentImages.length;
    }
    function nextImage() {
        currentIndex = (currentIndex + 1) % currentImages.length;
        showCurrent();
    }
    function prevImage() {
        currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
        showCurrent();
    }
    document.getElementById('lightbox').addEventListener('click', (e) => {
        if (e.target.id === 'lightbox') closeLightbox();
    });

    function resetFilters() {
        document.getElementById('search').value = '';
        document.getElementById('favOnly').checked = false;
        render();
    }

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('favOnly').addEventListener('change', render);

    applyLang();
    trackView();
    load();
</script>
</body>
</html>
