<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pul.zarill</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
        header { background: #111; color: #fff; padding: 22px; text-align: center; }
        header h1 { margin: 0; font-size: 30px; }
        header p { margin: 6px 0 0; color: #bbb; }
        header a { color: #7CFC9A; text-decoration: none; font-weight: bold; }
        main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
        .filters { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.12); margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
        .filters .field { display: flex; flex-direction: column; gap: 4px; }
        .filters label { font-size: 12px; color: #666; }
        .filters input { padding: 9px; font-size: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .filters #search { flex: 1; min-width: 160px; }
        .filters .price-field input { width: 120px; }
        .filters button { padding: 9px 14px; font-size: 15px; border: none; border-radius: 6px; background: #eee; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
        .card { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.12); position: relative; }
        .card img.thumb { width: 100%; height: 170px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; background: #eee; cursor: pointer; }
        .card h3 { margin: 0 0 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .badge-sold { background: #d33; color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 5px; font-weight: bold; }
        .desc { font-size: 14px; color: #555; margin-bottom: 12px; white-space: pre-wrap; }
        .price { font-size: 20px; font-weight: bold; color: #0a7d3b; margin-bottom: 14px; }
        .call { display: block; text-align: center; background: #0a7d3b; color: #fff; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .empty { text-align: center; color: #777; }

        #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 100; align-items: center; justify-content: center; flex-direction: column; }
        #lightbox.open { display: flex; }
        #lightbox img { max-width: 92vw; max-height: 76vh; object-fit: contain; border-radius: 6px; }
        #lightbox .nav { display: flex; align-items: center; gap: 24px; margin-top: 16px; }
        #lightbox button { background: #fff; border: none; border-radius: 6px; padding: 10px 16px; font-size: 18px; cursor: pointer; }
        #lightbox .close { position: absolute; top: 18px; right: 22px; background: transparent; color: #fff; font-size: 30px; border: none; cursor: pointer; }
        #lightbox .counter { color: #ccc; font-size: 14px; }
    </style>
</head>
<body>
<header>
    <h1>pul.zarill</h1>
    <p>Arzon avtomobillar do'koni</p>
    <p>Bog'lanish: <a href="tel:+998889500005">+998 88 950 00 05</a></p>
</header>
<main>
    <div class="filters">
        <div class="field" style="flex:1; min-width:160px;">
            <label>Qidirish</label>
            <input id="search" type="text" placeholder="Masalan: Nexia">
        </div>
        <button onclick="resetFilters()">Tozalash</button>
    </div>
    <div id="list" class="grid"></div>
</main>

<div id="lightbox">
    <button class="close" onclick="closeLightbox()">&times;</button>
    <img id="lightbox-img" src="">
    <div class="nav">
        <button onclick="prevImage()">&larr;</button>
        <span class="counter" id="lightbox-counter"></span>
        <button onclick="nextImage()">&rarr;</button>
    </div>
</div>

<script>
    let currentImages = [];
    let currentIndex = 0;
    let allCars = [];

    async function load() {
        const res = await fetch('/api/cars');
        allCars = await res.json();
        render();
    }

    function render() {
        const query = document.getElementById('search').value.trim().toLowerCase();

        const cars = allCars.filter(car => {
            return !query || car.name.toLowerCase().includes(query);
        });

        const list = document.getElementById('list');
        list.innerHTML = '';
        if (cars.length === 0) {
            list.innerHTML = '<p class="empty">Mos mashina topilmadi</p>';
            return;
        }
        for (const car of cars) {
            const images = car.images || [];
            const card = document.createElement('div');
            card.className = 'card';
            if (images.length) {
                const img = document.createElement('img');
                img.className = 'thumb';
                img.src = '/uploads/' + images[0];
                img.alt = car.name;
                img.onclick = () => openLightbox(images, 0);
                card.appendChild(img);
            }
            const title = document.createElement('h3');
            title.textContent = car.name;
            if (car.sold) {
                const badge = document.createElement('span');
                badge.className = 'badge-sold';
                badge.textContent = 'SOTILDI';
                title.appendChild(badge);
            }
            card.appendChild(title);
            if (car.description) {
                const desc = document.createElement('div');
                desc.className = 'desc';
                desc.textContent = car.description;
                card.appendChild(desc);
            }
            const price = document.createElement('div');
            price.className = 'price';
            price.textContent = car.price.toLocaleString('ru-RU') + " so'm";
            const call = document.createElement('a');
            call.className = 'call';
            call.href = 'tel:+998889500005';
            call.textContent = "Qo'ng'iroq qilish";
            card.append(price, call);
            list.appendChild(card);
        }
    }

    function openLightbox(images, index) {
        currentImages = images;
        currentIndex = index;
        showCurrent();
        document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('open');
    }
    function showCurrent() {
        document.getElementById('lightbox-img').src = '/uploads/' + currentImages[currentIndex];
        document.getElementById('lightbox-counter').textContent = (currentIndex + 1) + ' / ' + currentImages.length;
    }
    function nextImage() {
        currentIndex = (currentIndex + 1) % currentImages.length;
        showCurrent();
    }
    function prevImage() {
        currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
        showCurrent();
    }
    document.getElementById('lightbox').addEventListener('click', (e) => {
        if (e.target.id === 'lightbox') closeLightbox();
    });

    function resetFilters() {
        document.getElementById('search').value = '';
        render();
    }

    document.getElementById('search').addEventListener('input', render);

    load();
</script>
</body>
</html>
