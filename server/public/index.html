<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>pul.zarill</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f6f8;
    color:#171717;
    padding-bottom:75px;
    transition:.2s;
}

header{
    background:#111;
    color:#fff;
    text-align:center;
    padding:20px 15px;
}

.logo{
    margin:0;
    font-size:28px;
    font-weight:800;
}

.tagline{
    margin:6px 0 14px;
    color:#aaa;
    font-size:14px;
}

.contact{
    font-size:14px;
    margin-bottom:14px;
}

.contact a{
    color:#7CFC9A;
    text-decoration:none;
    font-weight:bold;
}

.lang-bar{
    display:flex;
    justify-content:center;
    gap:6px;
}

.lang-bar button{
    background:#222;
    color:#bbb;
    border:1px solid #444;
    border-radius:7px;
    padding:6px 12px;
    font-size:12px;
    cursor:pointer;
}

.lang-bar button.active{
    background:#7CFC9A;
    color:#111;
    border-color:#7CFC9A;
    font-weight:bold;
}

main{
    max-width:1050px;
    margin:auto;
    padding:18px 14px;
}

.search-box{
    background:#fff;
    padding:14px;
    border-radius:15px;
    margin-bottom:17px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.search-title{
    font-size:13px;
    color:#777;
    margin-bottom:7px;
}

.search-row{
    display:flex;
    gap:8px;
}

.search-wrap{
    position:relative;
    flex:1;
}

.search-icon{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    color:#888;
    font-size:18px;
}

#search{
    width:100%;
    height:46px;
    border:1px solid #ddd;
    border-radius:11px;
    padding:0 12px 0 40px;
    font-size:15px;
    outline:none;
    background:#fafafa;
}

.reset{
    height:46px;
    border:none;
    border-radius:11px;
    padding:0 15px;
    background:#eee;
    font-weight:bold;
    cursor:pointer;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.card{
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 2px 9px rgba(0,0,0,.08);
    cursor:pointer;
    transition:transform .15s;
}

.card:active{
    transform:scale(.98);
}

.image-box{
    position:relative;
    height:220px;
    background:#eee;
    overflow:hidden;
}

.thumb{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.fav-btn{
    position:absolute;
    top:10px;
    right:10px;
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.95);
    font-size:21px;
    cursor:pointer;
    z-index:5;
}

.fav-btn.active{
    color:#e33434;
}

.content{
    padding:13px;
}

.content h3{
    margin:0 0 7px;
    font-size:17px;
}

.badge{
    background:#d93434;
    color:#fff;
    font-size:10px;
    padding:4px 7px;
    border-radius:5px;
    margin-left:5px;
}

.short-desc{
    color:#666;
    font-size:13px;
    line-height:1.4;
    height:38px;
    overflow:hidden;
    margin-bottom:10px;
}

.more{
    color:#0a7d3b;
    font-size:12px;
    font-weight:bold;
    margin-bottom:10px;
}

.price{
    color:#087a3b;
    font-size:19px;
    font-weight:800;
    margin-bottom:11px;
}

.call{
    display:block;
    text-align:center;
    background:#0a7d3b;
    color:#fff;
    text-decoration:none;
    padding:11px;
    border-radius:10px;
    font-weight:bold;
    font-size:14px;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    color:#777;
    padding:50px 20px;
}

/* DETAIL */

#detailModal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    z-index:200;
    overflow-y:auto;
    padding:20px;
}

#detailModal.open{
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.detail-box{
    width:100%;
    max-width:650px;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    margin:auto;
    position:relative;
}

.detail-close{
    position:absolute;
    top:12px;
    right:12px;
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.7);
    color:#fff;
    font-size:25px;
    z-index:10;
    cursor:pointer;
}

.detail-main-image{
    width:100%;
    height:390px;
    background:#eee;
    object-fit:cover;
    display:block;
    cursor:pointer;
}

.detail-content{
    padding:18px;
}

.detail-title{
    font-size:25px;
    margin:0 0 8px;
}

.detail-price{
    color:#087a3b;
    font-size:24px;
    font-weight:800;
    margin-bottom:17px;
}

.detail-description{
    background:#f5f6f8;
    border-radius:12px;
    padding:15px;
    color:#333;
    line-height:1.6;
    font-size:15px;
    white-space:pre-wrap;
    word-break:break-word;
}

.detail-call{
    display:block;
    text-align:center;
    background:#0a7d3b;
    color:white;
    text-decoration:none;
    padding:14px;
    border-radius:11px;
    margin-top:16px;
    font-weight:bold;
}

/* LIGHTBOX */

#lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.94);
    z-index:300;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

#lightbox.open{
    display:flex;
}

#lightbox-img{
    max-width:94vw;
    max-height:75vh;
    object-fit:contain;
    border-radius:8px;
}

.light-nav{
    display:flex;
    align-items:center;
    gap:22px;
    margin-top:15px;
}

.light-nav button{
    border:none;
    background:white;
    border-radius:8px;
    padding:10px 17px;
    font-size:20px;
}

.counter{
    color:#ddd;
}

.light-close{
    position:absolute;
    top:18px;
    right:18px;
    background:transparent!important;
    color:white;
    font-size:32px!important;
}

/* MENU */

#menuModal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:500;
    padding:15px;
}

#menuModal.open{
    display:flex;
    justify-content:center;
    align-items:flex-end;
}

.menu-box{
    width:100%;
    max-width:500px;
    background:#fff;
    border-radius:20px 20px 0 0;
    padding:20px;
}

.menu-box h2{
    margin:0 0 18px;
}

.menu-item{
    width:100%;
    border:none;
    background:#f5f5f5;
    padding:14px;
    border-radius:12px;
    margin-bottom:9px;
    text-align:left;
    font-size:15px;
    cursor:pointer;
}

.menu-item a{
    color:inherit;
    text-decoration:none;
}

/* DARK */

body.dark{
    background:#101114;
    color:#eee;
}

body.dark .search-box,
body.dark .card,
body.dark .menu-box,
body.dark .detail-box{
    background:#1b1d21;
    color:#eee;
}

body.dark #search,
body.dark .menu-item{
    background:#25282d;
    color:#eee;
    border-color:#444;
}

body.dark .short-desc{
    color:#aaa;
}

body.dark .detail-description{
    background:#25282d;
    color:#eee;
}

body.dark .bottom-nav{
    background:rgba(25,27,30,.97);
    border-color:#333;
}

body.dark .nav-item{
    color:#aaa;
}

body.dark .nav-item.active{
    color:#7CFC9A;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    min-height:68px;
    background:rgba(255,255,255,.97);
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
    padding-bottom:env(safe-area-inset-bottom);
    backdrop-filter:blur(10px);
}

.nav-item{
    border:none;
    background:none;
    color:#777;
    font-size:11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    cursor:pointer;
}

.nav-item span{
    font-size:21px;
}

.nav-item.active{
    color:#0a7d3b;
    font-weight:bold;
}

/* MOBILE */

@media(max-width:800px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .image-box{
        height:190px;
    }
}

@media(max-width:520px){

    header{
        padding:17px 12px;
    }

    .logo{
        font-size:25px;
    }

    main{
        padding:12px 9px;
    }

    .grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:9px;
    }

    .card{
        border-radius:13px;
    }

    .image-box{
        height:145px;
    }

    .content{
        padding:9px;
    }

    .content h3{
        font-size:14px;
    }

    .short-desc{
        font-size:11px;
        height:32px;
    }

    .price{
        font-size:15px;
    }

    .call{
        padding:9px 4px;
        font-size:12px;
    }

    .fav-btn{
        width:34px;
        height:34px;
        top:7px;
        right:7px;
    }

    #detailModal{
        padding:10px;
    }

    .detail-box{
        border-radius:15px;
    }

    .detail-main-image{
        height:260px;
    }

    .detail-content{
        padding:14px;
    }

    .detail-title{
        font-size:21px;
    }

    .detail-price{
        font-size:21px;
    }

    .detail-description{
        font-size:14px;
    }
}
</style>
</head>

<body>

<header>

<h1 class="logo">pul.zarill</h1>

<p class="tagline" id="tagline">

<div class="lang-bar">

<button data-lang="ru" onclick="setLang('ru')">RU</button>

src=""
alt="Car"
>

<button onclick="prevImage()">←</button>

id="lightbox-counter">
</span>

<button onclick="nextImage()">→</button>

</div>


<!-- MENU -->

<div id="menuModal">

<div class="menu-box">

<h2>☰ Menyu</h2>

<button
class="menu-item"
onclick="toggleDarkMode()">

🌙 <span id="darkText">
Dark mode
</span>

</button>

<button class="menu-item">
ℹ️ Biz haqimizda

+998 88 950 00 05

href="https://t.me/"

📍 Manzil

</button>

class="menu-item"
onclick="closeMenu()">

✕ Yopish

</button>

</div>

</div>


<!-- BOTTOM -->

<nav class="bottom-nav">

<button
class="nav-item active"
onclick="goHome()">

<span>⌂</span>

<div id="navHome">
Bosh sahifa
</div>

</button>


<button
class="nav-item"
onclick="focusSearch()">

<span>⌕</span>

<div id="navSearch">
Qidirish
</div>

</button>


<button
class="nav-item"
onclick="showFavorites()">

<span>♡</span>

<div id="navFav">
Sevimlilar
</div>

</button>


<button
class="nav-item"
onclick="openMenu()">

<span>☰</span>

<div id="navMenu">
Menyu
</div>

</button>

</nav>


<script>

let allCars = [];
let favoritesMode = false;

let currentImages = [];
let currentIndex = 0;


/* LANGUAGES */

const translations = {

uz:{
tagline:"Arzon avtomobillar do'koni",
contactLabel:"Bog'lanish",
searchLabel:"Qidirish",
searchPlaceholder:"Masalan: Nexia",
resetBtn:"Tozalash",
callBtn:"Qo'ng'iroq qilish",
soldBadge:"SOTILDI",
more:"Batafsil ko'rish →",
emptyNoCars:"Hozircha mashinalar yo'q",
emptyNoMatch:"Mos mashina topilmadi",
navHome:"Bosh sahifa",
navSearch:"Qidirish",
navFav:"Sevimlilar",
navMenu:"Menyu"
},

ru:{
tagline:"Магазин недорогих автомобилей",
contactLabel:"Связаться",
searchLabel:"Поиск",
searchPlaceholder:"Например: Nexia",
resetBtn:"Очистить",
callBtn:"Позвонить",
soldBadge:"ПРОДАНО",
more:"Подробнее →",
emptyNoCars:"Пока нет автомобилей",
emptyNoMatch:"Ничего не найдено",
navHome:"Главная",
navSearch:"Поиск",
navFav:"Избранное",
navMenu:"Меню"
},

en:{
tagline:"Affordable car store",
contactLabel:"Contact",
searchLabel:"Search",
searchPlaceholder:"e.g. Nexia",
resetBtn:"Clear",
callBtn:"Call",
soldBadge:"SOLD",
more:"View details →",
emptyNoCars:"No cars yet",
emptyNoMatch:"No matching cars",
navHome:"Home",
navSearch:"Search",
navFav:"Favorites",
navMenu:"Menu"
}

};

let currentLang =
localStorage.getItem("lang") || "uz";


function setLang(lang){

currentLang=lang;

localStorage.setItem(
"lang",
lang
);

applyLang();

render();

}


function applyLang(){

const t =
translations[currentLang];

document.getElementById(
"tagline"
).textContent=t.tagline;

document.getElementById(
"contactLabel"
).textContent=t.contactLabel;

document.getElementById(
"searchLabel"
).textContent=t.searchLabel;

document.getElementById(
"search"
).placeholder=
t.searchPlaceholder;

document.getElementById(
"resetBtn"
).textContent=
t.resetBtn;

document.getElementById(
"detailCall"
).textContent=
t.callBtn;

document.getElementById(
"navHome"
).textContent=
t.navHome;

document.getElementById(
"navSearch"
).textContent=
t.navSearch;

document.getElementById(
"navFav"
).textContent=
t.navFav;

document.getElementById(
"navMenu"
).textContent=
t.navMenu;

document
.querySelectorAll(".lang-bar button")
.forEach(btn=>{

btn.classList.toggle(
"active",
btn.dataset.lang===currentLang
);

});

}


/* FAVORITES */

function getFavorites(){

try{

return JSON.parse(
localStorage.getItem("favorites") || "[]"
);

}catch{

return [];

}

}


function isFavorite(id){

return getFavorites().includes(id);

}


function toggleFavorite(id){

let favs=getFavorites();

if(favs.includes(id)){

favs=favs.filter(
f=>f!==id
);

}else{

favs.push(id);

}

localStorage.setItem(
"favorites",
JSON.stringify(favs)
);

render();

}


/* STATS */

function trackView(){

fetch(
"/api/stats/view",
{method:"POST"}
).catch(()=>{});

}


function trackCall(){

fetch(
"/api/stats/call",
{method:"POST"}
).catch(()=>{});

}


/* LOAD */

async function load(){

try{

const res=
await fetch("/api/cars");

allCars=
await res.json();

render();

}catch(error){

console.log(
"Cars load error:",
error
);

}

}


/* RENDER */

function render(){

const t=
translations[currentLang];

const query=
document
.getElementById("search")
.value
.trim()
.toLowerCase();


const cars=
allCars.filter(car=>{

const name=
String(
car.name || ""
).toLowerCase();

const description=
String(
car.description || ""
).toLowerCase();


const matchesSearch=
!query ||
name.includes(query) ||
description.includes(query);


const matchesFav=
!favoritesMode ||
isFavorite(car.id);


return matchesSearch &&
matchesFav;

});


const list=
document.getElementById("list");

list.innerHTML="";


if(cars.length===0){

const message=
allCars.length===0
?t.emptyNoCars
:t.emptyNoMatch;

list.innerHTML=
'<p class="empty">'+
message+
"</p>";

return;

}


cars.forEach(car=>{

const images=
car.images || [];


const card=
document.createElement("div");

card.className="card";


card.onclick=function(e){

if(
e.target.closest(".fav-btn") ||
e.target.closest(".call")
){

return;

}

openDetails(car);

};


/* IMAGE */

const imageBox=
document.createElement("div");

imageBox.className=
"image-box";


if(images.length){

const img=
document.createElement("img");

img.className="thumb";

img.src=
"/uploads/"+images[0];

img.alt=
car.name || "Car";

img.loading="lazy";

img.onclick=function(e){

e.stopPropagation();

openDetails(car);

};

imageBox.appendChild(img);

}


/* FAVORITE */

const fav=
document.createElement("button");

fav.className=
"fav-btn"+
(
isFavorite(car.id)
?" active":""
);

fav.textContent=
isFavorite(car.id)
?"♥":"♡";

fav.onclick=function(e){

e.stopPropagation();

toggleFavorite(car.id);

};

imageBox.appendChild(fav);

card.appendChild(imageBox);


/* CONTENT */

const content=
document.createElement("div");

content.className="content";


const title=
document.createElement("h3");

title.textContent=
car.name ||
"Avtomobil";


if(car.sold){

const badge=
document.createElement("span");

badge.className="badge";

badge.textContent=
t.soldBadge;

title.appendChild(badge);

}

content.appendChild(title);


/* SHORT DESCRIPTION */

if(car.description){

const desc=
document.createElement("div");

desc.className=
"short-desc";

desc.textContent=
car.description;

content.appendChild(desc);

}


/* MORE */

const more=
document.createElement("div");

more.className="more";

more.textContent=
t.more;

content.appendChild(more);


/* PRICE */

const price=
document.createElement("div");

price.className="price";

price.textContent=
Number(
car.price || 0
).toLocaleString("ru-RU")
+" so'm";

content.appendChild(price);


/* CALL */

const call=
document.createElement("a");

call.className="call";

call.href=
"tel:+998889500005";

call.textContent=
t.callBtn;

call.onclick=function(){

trackCall();

};

content.appendChild(call);

card.appendChild(content);

list.appendChild(card);

});

}


/* DETAIL */

function openDetails(car){

document.getElementById(
"detailTitle"
).textContent=
car.name || "Avtomobil";


document.getElementById(
"detailPrice"
).textContent=
Number(
car.price || 0
).toLocaleString("ru-RU")
+" so'm";


document.getElementById(
"detailDescription"
).textContent=
car.description ||
"Ma'lumot mavjud emas";


const image=
document.getElementById(
"detailImage"
);


if(
car.images &&
car.images.length
){

image.src=
"/uploads/"+car.images[0];

image.style.display="block";

image.onclick=function(){

openLightbox(
car.images,
0
);

};

}else{

image.style.display="none";

}


document.getElementById(
"detailModal"
).classList.add("open");

document.body.style.overflow="hidden";

}


function closeDetails(){

document.getElementById(
"detailModal"
).classList.remove("open");

document.body.style.overflow="";

}


/* CLOSE DETAIL */

document.getElementById(
"detailModal"
).addEventListener(
"click",
function(e){

if(e.target===this){

closeDetails();

}

}
);


/* LIGHTBOX */

function openLightbox(images,index){

currentImages=images;

currentIndex=index;

showCurrent();

document.getElementById(
"lightbox"
).classList.add("open");

}


function closeLightbox(){

document.getElementById(
"lightbox"
).classList.remove("open");

}


function showCurrent(){

if(!currentImages.length)
return;

document.getElementById(
"lightbox-img"
).src=
"/uploads/"+
currentImages[currentIndex];

document.getElementById(
"lightbox-counter"
).textContent=
(currentIndex+1)+
" / "+
currentImages.length;

}


function nextImage(){

if(!currentImages.length)
return;

currentIndex=
(currentIndex+1)%
currentImages.length;

showCurrent();

}


function prevImage(){

if(!currentImages.length)
return;

currentIndex=
(currentIndex-1+
currentImages.length)%
currentImages.length;

showCurrent();

}


document.getElementById(
"lightbox"
).addEventListener(
"click",
function(e){

if(e.target.id==="lightbox"){

closeLightbox();

}

}
);


/* SEARCH */

function resetSearch(){

document.getElementById(
"search"
).value="";

favoritesMode=false;

render();

}


document.getElementById(
"search"
).addEventListener(
"input",
function(){

favoritesMode=false;

render();

}
);


/* HOME */

function goHome(){

favoritesMode=false;

document.getElementById(
"search"
).value="";

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* SEARCH BUTTON */

function focusSearch(){

favoritesMode=false;

render();

document.getElementById(
"search"
).focus();

}


/* FAVORITES */

function showFavorites(){

favoritesMode=true;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* MENU */

function openMenu(){

document.getElementById(
"menuModal"
).classList.add("open");

document.body.style.overflow="hidden";

}


function closeMenu(){

document.getElementById(
"menuModal"
).classList.remove("open");

document.body.style.overflow="";

}


/* MENU OUTSIDE CLICK */

document.getElementById(
"menuModal"
).addEventListener(
"click",
function(e){

if(e.target===this){

closeMenu();

}

}
);


/* DARK MODE */

function toggleDarkMode(){

document.body.classList.toggle("dark");

localStorage.setItem(
"darkMode",
document.body.classList.contains("dark")
);

}


if(
localStorage.getItem("darkMode")
==="true"
){

document.body.classList.add("dark");

}


/* ESC */

document.addEventListener(
"keydown",
function(e){

if(e.key==="Escape"){

closeDetails();

closeLightbox();

closeMenu();

}

}
);


/* START */

applyLang();

trackView();

load();

</script>

</body>
</html>
