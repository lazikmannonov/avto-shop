<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pul.zarill</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
        header { background: #111; color: #fff; padding: 22px; text-align: center; }
        header h1 { margin: 0; font-size: 30px; }
        header p { margin: 6px 0 0; color: #bbb; }
        header a { color: #7CFC9A; text-decoration: none; font-weight: bold; }
        main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
        .card { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
        .card img { width: 100%; height: 170px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; background: #eee; }
        .card h3 { margin: 0 0 10px; }
        .price { font-size: 20px; font-weight: bold; color: #0a7d3b; margin-bottom: 14px; }
        .call { display: block; text-align: center; background: #0a7d3b; color: #fff; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .empty { text-align: center; color: #777; }
    </style>
</head>
<body>
<header>
    <h1>pul.zarill</h1>
    <p>Arzon avtomobillar do'koni</p>
    <p>Bog'lanish: <a href="tel:+998889500005">+998 88 950 00 05</a></p>
</header>
<main>
    <div id="list" class="grid"></div>
</main>
<script>
    async function load() {
        const res = await fetch('/api/cars');
        const cars = await res.json();
        const list = document.getElementById('list');
        list.innerHTML = '';
        if (cars.length === 0) {
            list.className = '';
            list.innerHTML = '<p class="empty">Hozircha mashinalar yo\'q</p>';
            return;
        }
        for (const car of cars) {
            const card = document.createElement('div');
            card.className = 'card';
            if (car.image) {
                const img = document.createElement('img');
                img.src = '/uploads/' + car.image;
                img.alt = car.name;
                card.appendChild(img);
            }
            const title = document.createElement('h3');
            title.textContent = car.name;
            const price = document.createElement('div');
            price.className = 'price';
            price.textContent = car.price.toLocaleString('ru-RU') + ' $';
            const call = document.createElement('a');
            call.className = 'call';
            call.href = 'tel:+998889500005';
            call.textContent = "Qo'ng'iroq qilish";
            card.append(title, price, call);
            list.appendChild(card);
        }
    }
    load();
</script>
</body>
</html>
