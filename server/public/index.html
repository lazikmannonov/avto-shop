<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>pul.zarill</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #171717;
            padding-bottom: 75px;
        }

        header {
            background: #111;
            color: #fff;
            text-align: center;
            padding: 20px 15px;
        }

        .logo {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
        }

        .tagline {
            margin: 6px 0 14px;
            color: #aaa;
            font-size: 14px;
        }

        .contact {
            font-size: 14px;
            margin-bottom: 14px;
        }

        .contact a {
            color: #7CFC9A;
            text-decoration: none;
            font-weight: bold;
        }

        .lang-bar {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .lang-bar button {
            background: #222;
            color: #bbb;
            border: 1px solid #444;
            border-radius: 7px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
        }

        .lang-bar button.active {
            background: #7CFC9A;
            color: #111;
            border-color: #7CFC9A;
            font-weight: bold;
        }

        main {
            max-width: 1050px;
            margin: auto;
            padding: 18px 14px;
        }

        .search-box {
            background: #fff;
            padding: 14px;
            border-radius: 15px;
            margin-bottom: 17px;
            box-shadow: 0 2px 10px rgba(0,0,0,.07);
        }

        .search-title {
            font-size: 13px;
            color: #777;
            margin-bottom: 7px;
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .search-wrap {
            position: relative;
            flex: 1;
        }

        .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 18px;
        }

        #search {
            width: 100%;
            height: 46px;
            border: 1px solid #ddd;
            border-radius: 11px;
            padding: 0 12px 0 40px;
            font-size: 15px;
            outline: none;
            background: #fafafa;
        }

        #search:focus {
            border-color: #0a7d3b;
            background: #fff;
        }

        .reset {
            height: 46px;
            border: none;
            border-radius: 11px;
            padding: 0 15px;
            background: #eee;
            font-weight: bold;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 9px rgba(0,0,0,.08);
            cursor: pointer;
            transition: transform .15s;
        }

        .card:active {
            transform: scale(.98);
        }

        .image-box {
            position: relative;
            height: 220px;
            background: #eee;
            overflow: hidden;
        }

        .thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .fav-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,.95);
            font-size: 21px;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
        }

        .fav-btn.active {
            color: #e33434;
        }

        .content {
            padding: 13px;
        }

        .content h3 {
            margin: 0 0 7px;
            font-size: 17px;
        }

        .badge {
            background: #d93434;
            color: #fff;
            font-size: 10px;
            padding: 4px 7px;
            border-radius: 5px;
            margin-left: 5px;
        }

        .short-desc {
            color: #666;
            font-size: 13px;
            line-height: 1.4;
            height: 38px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .more {
            color: #0a7d3b;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .price {
            color: #087a3b;
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 11px;
        }

        .call {
            display: block;
            text-align: center;
            background: #0a7d3b;
            color: #fff;
            text-decoration: none;
            padding: 11px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #777;
            padding: 50px 20px;
        }

        /* DETAIL MODAL */

        #detailModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.72);
            z-index: 200;
            overflow-y: auto;
            padding: 20px;
        }

        #detailModal.open {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .detail-box {
            width: 100%;
            max-width: 650px;
            background: #fff;
            border-radius: 18px;
            overflow: hidden;
            margin: auto;
            position: relative;
        }

        .detail-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(0,0,0,.7);
            color: #fff;
            font-size: 25px;
            z-index: 10;
            cursor: pointer;
        }

        .detail-main-image {
            width: 100%;
            height: 390px;
            background: #eee;
            object-fit: cover;
            display: block;
        }

        .detail-content {
            padding: 18px;
        }

        .detail-title {
            font-size: 25px;
            margin: 0 0 8px;
        }

        .detail-price {
            color: #087a3b;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 17px;
        }

        .detail-description {
            background: #f5f6f8;
            border-radius: 12px;
            padding: 15px;
            color: #333;
            line-height: 1.6;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .detail-call {
            display: block;
            text-align: center;
            background: #0a7d3b;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 11px;
            margin-top: 16px;
            font-weight: bold;
        }

        /* PHOTO LIGHTBOX */

        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.94);
            z-index: 300;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #lightbox.open {
            display: flex;
        }

        #lightbox-img {
            max-width: 94vw;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .light-nav {
            display: flex;
            align-items: center;
            gap: 22px;
            margin-top: 15px;
        }

        .light-nav button {
            border: none;
            background: white;
            border-radius: 8px;
            padding: 10px 17px;
            font-size: 20px;
        }

        .counter {
            color: #ddd;
        }

        .light-close {
            position: absolute;
            top: 18px;
            right: 18px;
            background: transparent !important;
            color: white;
            font-size: 32px !important;
        }

        /* BOTTOM MENU */

        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            min-height: 68px;
            background: rgba(255,255,255,.97);
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
            backdrop-filter: blur(10px);
        }

        .nav-item {
            border: none;
            background: none;
            color: #777;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item span {
            font-size: 21px;
        }

        .nav-item.active {
            color: #0a7d3b;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .image-box {
                height: 190px;
            }
        }

        @media (max-width: 520px) {
            header {
                padding: 17px 12px;
            }

            .logo {
                font-size: 25px;
            }

            main {
                padding: 12px 9px;
            }

            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 9px;
            }

            .card {
                border-radius: 13px;
            }

            .image-box {
                height: 145px;
            }

            .content {
                padding: 9px;
            }

            .content h3 {
                font-size: 14px;
            }

            .short-desc {
                font-size: 11px;
                height: 32px;
            }

            .price {
                font-size: 15px;
            }

            .call {
                padding: 9px 4px;
                font-size: 12px;
            }

            .fav-btn {
                width: 34px;
                height: 34px;
                top: 7px;
                right: 7px;
            }

            #detailModal {
                padding: 10px;
            }

            .detail-box {
                border-radius: 15px;
            }

            .detail-main-image {
                height: 260px;
            }

            .detail-content {
                padding: 14px;
            }

            .detail-title {
                font-size: 21px;
            }

            .detail-price {
                font-size: 21px;
            }

            .detail-description {
                font-size: 14px;
                line-height: 1.55;
            }
        }
    </style>
</head>

<body>

<header>

    <h1 class="logo">pul.zarill</h1>

    <p class="tagline" id="tagline">
        Arzon avtomobillar do'koni
    </p>

    <div class="contact">
        <span id="contactLabel">Bog'lanish</span>:
        <a href="tel:+998889500005">
            +998 88 950 00 05
        </a>
    </div>

    <div class="lang-bar">
        <button data-lang="uz" onclick="setLang('uz')">UZ</button>
        <button data-lang="ru" onclick="setLang('ru')">RU</button>
        <button data-lang="en" onclick="setLang('en')">EN</button>
    </div>

</header>

<main>

    <div class="search-box">

        <div class="search-title" id="searchLabel">
            Qidirish
        </div>

        <div class="search-row">

            <div class="search-wrap">
                <span class="search-icon">⌕</span>

                <input
                    id="search"
                    type="text"
                    placeholder="Masalan: Nexia"
                    autocomplete="off"
                >
            </div>

            <button
                class="reset"
                id="resetBtn"
                onclick="resetSearch()">
                Tozalash
            </button>

        </div>

    </div>

    <div id="list" class="grid"></div>

</main>


<!-- DETAIL -->

<div id="detailModal">

    <div class="detail-box">

        <button
            class="detail-close"
            onclick="closeDetails()">
            ×
        </button>

        <img
            id="detailImage"
            class="detail-main-image"
            src=""
            alt="Car">

        <div class="detail-content">

            <h2
                id="detailTitle"
                class="detail-title">
            </h2>

            <div
                id="detailPrice"
                class="detail-price">
            </div>

            <div
                id="detailDescription"
                class="detail-description">
            </div>

            <a
                class="detail-call"
                href="tel:+998889500005"
                onclick="trackCall()"
                id="detailCall">
                Qo'ng'iroq qilish
            </a>

        </div>

    </div>

</div>


<!-- PHOTO -->

<div id="lightbox">

    <button
        class="light-close"
        onclick="closeLightbox()">
        ×
    </button>

    <img
        id="lightbox-img"
        src=""
        alt="Car">

    <div class="light-nav">

        <button onclick="prevImage()">←</button>

        <span
            class="counter"
            id="lightbox-counter">
        </span>

        <button onclick="nextImage()">→</button>

    </div>

</div>


<!-- BOTTOM -->

<nav class="bottom-nav">

    <button
        class="nav-item active"
        onclick="goHome()">

        <span>⌂</span>
        <div id="navHome">Bosh sahifa</div>

    </button>

    <button
        class="nav-item"
        onclick="focusSearch()">

        <span>⌕</span>
        <div id="navSearch">Qidirish</div>

    </button>

    <button
        class="nav-item"
        onclick="showFavorites()">

        <span>♡</span>
        <div id="navFav">Sevimlilar</div>

    </button>

    <button
        class="nav-item"
        onclick="callNumber()">

        <span>☎</span>
        <div id="navContact">Aloqa</div>

    </button>

</nav>


<script>

    let allCars = [];
    let favoritesMode = false;

    let currentImages = [];
    let currentIndex = 0;


    const translations = {

        uz: {
            tagline: "Arzon avtomobillar do'koni",
            contactLabel: "Bog'lanish",
            searchLabel: "Qidirish",
            searchPlaceholder: "Masalan: Nexia",
            resetBtn: "Tozalash",
            callBtn: "Qo'ng'iroq qilish",
            soldBadge: "SOTILDI",
            more: "Batafsil ko'rish →",
            emptyNoCars: "Hozircha mashinalar yo'q",
            emptyNoMatch: "Mos mashina topilmadi",
            navHome: "Bosh sahifa",
            navSearch: "Qidirish",
            navFav: "Sevimlilar",
            navContact: "Aloqa"
        },

        ru: {
            tagline: "Магазин недорогих автомобилей",
            contactLabel: "Связаться",
            searchLabel: "Поиск",
            searchPlaceholder: "Например: Nexia",
            resetBtn: "Очистить",
            callBtn: "Позвонить",
            soldBadge: "ПРОДАНО",
            more: "Подробнее →",
            emptyNoCars: "Пока нет автомобилей",
            emptyNoMatch: "Ничего не найдено",
            navHome: "Главная",
            navSearch: "Поиск",
            navFav: "Избранное",
            navContact: "Связаться"
        },

        en: {
            tagline: "Affordable car store",
            contactLabel: "Contact",
            searchLabel: "Search",
            searchPlaceholder: "e.g. Nexia",
            resetBtn: "Clear",
            callBtn: "Call",
            soldBadge: "SOLD",
            more: "View details →",
            emptyNoCars: "No cars yet",
            emptyNoMatch: "No matching cars",
            navHome: "Home",
            navSearch: "Search",
            navFav: "Favorites",
            navContact: "Contact"
        }

    };


    let currentLang =
        localStorage.getItem("lang") || "uz";


    function setLang(lang) {

        currentLang = lang;

        localStorage.setItem(
            "lang",
            lang
        );

        applyLang();

        render();
    }


    function applyLang() {

        const t =
            translations[currentLang];

        document.getElementById(
            "tagline"
        ).textContent = t.tagline;

        document.getElementById(
            "contactLabel"
        ).textContent = t.contactLabel;

        document.getElementById(
            "searchLabel"
        ).textContent = t.searchLabel;

        document.getElementById(
            "search"
        ).placeholder =
            t.searchPlaceholder;

        document.getElementById(
            "resetBtn"
        ).textContent =
            t.resetBtn;

        document.getElementById(
            "detailCall"
        ).textContent =
            t.callBtn;

        document.getElementById(
            "navHome"
        ).textContent =
            t.navHome;

        document.getElementById(
            "navSearch"
        ).textContent =
            t.navSearch;

        document.getElementById(
            "navFav"
        ).textContent =
            t.navFav;

        document.getElementById(
            "navContact"
        ).textContent =
            t.navContact;


        document
            .querySelectorAll(
                ".lang-bar button"
            )
            .forEach(btn => {

                btn.classList.toggle(
                    "active",
                    btn.dataset.lang ===
                    currentLang
                );

            });

    }


    function getFavorites() {

        try {

            return JSON.parse(
                localStorage.getItem(
                    "favorites"
                ) || "[]"
            );

        } catch {

            return [];

        }

    }


    function isFavorite(id) {

        return getFavorites()
            .includes(id);

    }


    function toggleFavorite(id) {

        let favs =
            getFavorites();

        if (favs.includes(id)) {

            favs =
                favs.filter(
                    f => f !== id
                );

        } else {

            favs.push(id);

        }

        localStorage.setItem(
            "favorites",
            JSON.stringify(favs)
        );

        render();

    }


    function trackView() {

        fetch(
            "/api/stats/view",
            {
                method: "POST"
            }
        ).catch(() => {});

    }


    function trackCall() {

        fetch(
            "/api/stats/call",
            {
                method: "POST"
            }
        ).catch(() => {});

    }


    async function load() {

        try {

            const res =
                await fetch(
                    "/api/cars"
                );

            allCars =
                await res.json();

            render();

        } catch (error) {

            console.log(
                "Cars load error:",
                error
            );

        }

    }


    function render() {

        const t =
            translations[currentLang];

        const query =
            document
                .getElementById("search")
                .value
                .trim()
                .toLowerCase();


        const cars =
            allCars.filter(car => {

                const name =
                    String(
                        car.name || ""
                    ).toLowerCase();

                const description =
                    String(
                        car.description || ""
                    ).toLowerCase();


                const matchesSearch =
                    !query ||
                    name.includes(query) ||
                    description.includes(query);


                const matchesFav =
                    !favoritesMode ||
                    isFavorite(car.id);


                return (
                    matchesSearch &&
                    matchesFav
                );

            });


        const list =
            document.getElementById(
                "list"
            );

        list.innerHTML = "";


        if (cars.length === 0) {

            const message =
                allCars.length === 0
                    ? t.emptyNoCars
                    : t.emptyNoMatch;

            list.innerHTML =
                '<p class="empty">' +
                message +
                "</p>";

            return;

        }


        cars.forEach(car => {

            const images =
                car.images || [];


            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "card";


            /*
                KARTA BOSILGANDA
                TO'LIQ MA'LUMOT OCHILADI
            */

            card.onclick =
                function(e) {

                    if (
                        e.target.closest(
                            ".fav-btn"
                        ) ||
                        e.target.closest(
                            ".call"
                        )
                    ) {
                        return;
                    }

                    openDetails(car);

                };


            const imageBox =
                document.createElement(
                    "div"
                );

            imageBox.className =
                "image-box";


            if (images.length) {

                const img =
                    document.createElement(
                        "img"
                    );

                img.className =
                    "thumb";

                img.src =
                    "/uploads/" +
                    images[0];

                img.alt =
                    car.name || "Car";

                img.loading =
                    "lazy";


                img.onclick =
                    function(e) {

                        e.stopPropagation();

                        openDetails(car);

                    };


                imageBox.appendChild(img);

            }


            const fav =
                document.createElement(
                    "button"
                );

            fav.className =
                "fav-btn" +
                (
                    isFavorite(car.id)
                        ? " active"
                        : ""
                );

            fav.textContent =
                isFavorite(car.id)
                    ? "♥"
                    : "♡";


            fav.onclick =
                function(e) {

                    e.stopPropagation();

                    toggleFavorite(
                        car.id
                    );

                };


            imageBox.appendChild(fav);

            card.appendChild(
                imageBox
            );


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "content";


            const title =
                document.createElement(
                    "h3"
                );

            title.textContent =
                car.name ||
                "Avtomobil";


            if (car.sold) {

                const badge =
                    document.createElement(
                        "span"
                    );

                badge.className =
                    "badge";

                badge.textContent =
                    t.soldBadge;

                title.appendChild(
                    badge
                );

            }


            content.appendChild(
                title
            );


            if (car.description) {

                const desc =
                    document.createElement(
                        "div"
                    );

                desc.className =
                    "short-desc";

                desc.textContent =
                    car.description;

                content.appendChild(
                    desc
                );

            }


            const more =
                document.createElement(
                    "div"
                );

            more.className =
                "more";

            more.textContent =
                t.more;

            content.appendChild(
                more
            );


            const price =
                document.createElement(
                    "div"
                );

            price.className =
                "price";

            price.textContent =
                Number(
                    car.price || 0
                ).toLocaleString(
                    "ru-RU"
                ) +
                " so'm";


            content.appendChild(
                price
            );


            const call =
                document.createElement(
                    "a"
                );

            call.className =
                "call";

            call.href =
                "tel:+998889500005";

            call.textContent =
                t.callBtn;


            call.onclick =
                function() {

                    trackCall();

                };


            content.appendChild(
                call
            );


            card.appendChild(
                content
            );


            list.appendChild(
                card
            );

        });

    }


    /*
        TO'LIQ MA'LUMOT OYNASI
    */

    function openDetails(car) {

        const modal =
            document.getElementById(
                "detailModal"
            );


        document.getElementById(
            "detailTitle"
        ).textContent =
            car.name ||
            "Avtomobil";


        document.getElementById(
            "detailPrice"
        ).textContent =
            Number(
                car.price || 0
            ).toLocaleString(
                "ru-RU"
            ) +
            " so'm";


        document.getElementById(
            "detailDescription"
        ).textContent =
            car.description ||
            "Ma'lumot mavjud emas";


        const image =
            document.getElementById(
                "detailImage"
            );


        if (
            car.images &&
            car.images.length
        ) {

            image.src =
                "/uploads/" +
                car.images[0];

            image.style.display =
                "block";

        } else {

            image.style.display =
                "none";

        }


        /*
            DETAL RASMINI BOSSA
            RASMLAR GALEREYASI OCHILADI
        */

        image.onclick =
            function() {

                if (
                    car.images &&
                    car.images.length
                ) {

                    openLightbox(
                        car.images,
                        0
                    );

                }

            };


        modal.classList.add(
            "open"
        );


        document.body.style.overflow =
            "hidden";

    }


    function closeDetails() {

        document
            .getElementById(
                "detailModal"
            )
            .classList.remove(
                "open"
            );

        document.body.style.overflow =
            "";

    }


    /*
        MODAL TASHQARISIGA BOSILSA YOPILADI
    */

    document
        .getElementById(
            "detailModal"
        )
        .addEventListener(
            "click",
            function(e) {

                if (
                    e.target ===
                    this
                ) {

                    closeDetails();

                }

            }
        );


    /*
        RASMLAR GALEREYASI
    */

    function openLightbox(
        images,
        index
    ) {

        currentImages =
            images;

        currentIndex =
            index;


        showCurrent();


        document
            .getElementById(
                "lightbox"
            )
            .classList.add(
                "open"
            );

    }


    function closeLightbox() {

        document
            .getElementById(
                "lightbox"
            )
            .classList.remove(
                "open"
            );

    }


    function showCurrent() {

        if (
            !currentImages.length
        ) return;


        document.getElementById(
            "lightbox-img"
        ).src =
            "/uploads/" +
            currentImages[
                currentIndex
            ];


        document.getElementById(
            "lightbox-counter"
        ).textContent =
            (
                currentIndex + 1
            ) +
            " / " +
            currentImages.length;

    }


    function nextImage() {

        if (
            !currentImages.length
        ) return;


        currentIndex =
            (
                currentIndex + 1
            ) %
            currentImages.length;


        showCurrent();

    }


    function prevImage() {

        if (
            !currentImages.length
        ) return;


        currentIndex =
            (
                currentIndex -
                1 +
                currentImages.length
            ) %
            currentImages.length;


        showCurrent();

    }


    document
        .getElementById(
            "lightbox"
        )
        .addEventListener(
            "click",
            function(e) {

                if (
                    e.target.id ===
                    "lightbox"
                ) {

                    closeLightbox();

                }

            }
        );


    function resetSearch() {

        document
            .getElementById(
                "search"
            )
            .value = "";

        favoritesMode =
            false;

        render();

    }


    document
        .getElementById(
            "search"
        )
        .addEventListener(
            "input",
            function() {

                favoritesMode =
                    false;

                render();

            }
        );


    function goHome() {

        favoritesMode =
            false;

        document
            .getElementById(
                "search"
            )
            .value = "";

        render();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    function focusSearch() {

        favoritesMode =
            false;

        render();

        document
            .getElementById(
                "search"
            )
            .focus();

    }


    function showFavorites() {

        favoritesMode =
            true;

        render();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    function callNumber() {

        trackCall();

        window.location.href =
            "tel:+998889500005";

    }


    /*
        ESC BOSILSA OYNANI YOPISH
    */

    document.addEventListener(
        "keydown",
        function(e) {

            if (
                e.key === "Escape"
            ) {

                closeDetails();

                closeLightbox();

            }

        }
    );


    /*
        ISHGA TUSHIRISH
    */

    applyLang();

    trackView();

    load();

</script>

</body>
</html>
